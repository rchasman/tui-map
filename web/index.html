<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080e16">
  <title>TUI Map — a world of reactions</title>
  <meta name="description" content="An interactive Braille globe. Explore the world, release nine elemental effects, and watch their reactions unfold.">
  <meta property="og:title" content="TUI Map — a world of reactions">
  <meta property="og:description" content="A living terminal globe. Nine effects. Endless combinations.">
  <meta property="og:type" content="website">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main id="stage" aria-label="Terminal map application">
    <canvas id="world" tabindex="0" aria-label="Interactive terminal globe. Drag to rotate, scroll to zoom, click to select a marker or use a selected effect. Click labels to inspect. Press 1 to 9 to select effects, G to switch projection, Escape to return to the crosshair, R to reset, and ? for help."></canvas>
    <aside id="inspector" aria-labelledby="inspector-title" hidden>
      <header><h2 id="inspector-title"></h2><button id="inspector-close" type="button" aria-label="Close details">×</button></header>
      <div class="inspector-body">
        <p id="inspector-source"></p><p id="inspector-detail"></p>
        <dl><dt>Coordinates</dt><dd id="inspector-coordinates"></dd><dt>Observed</dt><dd id="inspector-time"></dd></dl>
      </div>
      <a id="inspector-link" target="_blank" rel="noopener noreferrer" aria-label="Open source in a new tab"></a>
    </aside>
    <p id="loading" role="status">Loading map…</p>
    <p id="error" role="alert" hidden></p>
  </main>
  <noscript>This interactive map requires JavaScript and WebAssembly.</noscript>
  <script type="module" src="./app.js"></script>
</body>
</html>
