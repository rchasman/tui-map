<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080e16">
  <title>TUI Map — a world of reactions</title>
  <meta name="description" content="An interactive Braille globe. Explore the world, release six elemental effects, and watch their reactions unfold.">
  <meta property="og:title" content="TUI Map — a world of reactions">
  <meta property="og:description" content="A living terminal globe. Six effects. Endless combinations.">
  <meta property="og:type" content="website">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main id="stage" aria-label="Terminal map application">
    <canvas id="world" tabindex="0" aria-label="Interactive terminal globe. Drag to rotate, scroll to zoom, click to release an effect. Click the terminal controls or press 1 to 6 to select effects, G to switch projection, Escape to pause, R to reset, and ? for help."></canvas>
    <p id="loading" role="status">Loading map…</p>
    <p id="error" role="alert" hidden></p>
  </main>
  <noscript>This interactive map requires JavaScript and WebAssembly.</noscript>
  <script type="module" src="./app.js"></script>
</body>
</html>
