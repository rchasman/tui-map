[package]
name = "tui-map"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "High-performance terminal map visualization using Braille Unicode"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ratatui = { version = "0.30.2", default-features = false }
geojson = { version = "1.0.0", default-features = false }
anyhow = "1.0.104"
glam = { version = "0.33.7", default-features = false, features = ["std", "f64"] }
foldhash = "0.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sgp4 = "2.4.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
crossterm = "0.29.0"
rayon = "1.12.0"
simd-json = "0.18.1"
ureq = "3.4.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.128"
console_error_panic_hook = "0.1.7"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }

[[bench]]
name = "hot_paths"
harness = false

[[bench]]
name = "spinning"
harness = false

[[bench]]
name = "low_level"
harness = false

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
